<div class="container">
    <h2>Contact Us</h2>
    <p style="text-align:center;">We'd love to hear from you! Send us a message below.</p>
    <form class="contact-form" id="contact-form" method="post" action="api.php?action=submit_contact">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" name="name" required>

        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="email" required>

        <label for="contact-msg">Message</label>
        <textarea id="contact-msg" name="message" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <div class="contact-info" style="text-align:center; margin-top:20px;">
        <p>Email: <a href="mailto:s.girinathangiri787@gmail.com">s.girinathangiri787@gmail.com</a></p>
        <p>Phone: 8838540564</p>
        <p>Address: 123 Grocery Lane, Food City, Country</p>
    </div>
</div>
